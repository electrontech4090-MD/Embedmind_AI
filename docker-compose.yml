services:
  # 1. FastAPI Backend API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: embedmind-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql://embedmind_user:embedmind_password@postgres:5432/embedmind_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Next.js Web Frontend Application
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: embedmind-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: embedmind-postgres
    environment:
      POSTGRES_USER: embedmind_user
      POSTGRES_PASSWORD: embedmind_password
      POSTGRES_DB: embedmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embedmind_user -d embedmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis Cache & Messaging Broker
  redis:
    image: redis:7-alpine
    container_name: embedmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Vector Database (ChromaDB)
  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: embedmind-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  chroma_data:
